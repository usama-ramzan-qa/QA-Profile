<svg width="280" height="280" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#FF2E9A"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Diamond badge, same silhouette as the reference -->
  <path d="M140 6 L274 140 L140 274 L6 140 Z" fill="#0B0F1A"/>

  <g transform="translate(140,140) scale(0.82) translate(-118,-118)">
    <!-- U monogram, doubles as the body of a magnifying glass -->
    <g filter="url(#glow)">
      <path d="M74 58 L74 132 C74 156 92 174 118 174 C144 174 162 156 162 132 L162 58"
            fill="none" stroke="url(#neonGrad)" stroke-width="18" stroke-linecap="round"/>
    </g>

    <!-- Inspection ring -->
    <circle cx="118" cy="118" r="66" fill="none" stroke="url(#neonGrad)" stroke-width="4" opacity="0.28"/>

    <!-- Magnifying glass handle -->
    <line x1="163" y1="163" x2="192" y2="192" stroke="url(#neonGrad)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

    <!-- Bug icon, flat faceted diamond body -->
    <g transform="translate(118,120)">
      <line x1="-20" y1="-8"  x2="-32" y2="-15" stroke="#14E8B4" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <line x1="-22" y1="2"   x2="-36" y2="2"   stroke="#14E8B4" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <line x1="-20" y1="12"  x2="-32" y2="19"  stroke="#14E8B4" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <line x1="20"  y1="-8"  x2="32"  y2="-15" stroke="#14E8B4" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <line x1="22"  y1="2"   x2="36"  y2="2"   stroke="#14E8B4" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <line x1="20"  y1="12"  x2="32"  y2="19"  stroke="#14E8B4" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <line x1="-6" y1="-24" x2="-12" y2="-34" stroke="#14E8B4" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <line x1="6"  y1="-24" x2="12"  y2="-34" stroke="#14E8B4" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <path d="M0 -22 L20 0 L0 22 L-20 0 Z" fill="#14E8B4"/>
      <path d="M0 -34 L8 -22 L0 -10 L-8 -22 Z" fill="#14E8B4" opacity="0.85"/>
    </g>
  </g>
</svg>
